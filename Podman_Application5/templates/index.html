<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Podman Plot Uygulaması</title>
    <!-- Plotly kütüphanesini dahil ediyoruz -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .controls { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>Etkileşimli Grafik Arayüzü</h2>
    
    <div class="controls">
        <label for="freq">Frekans Çarpanı: </label>
        <input type="number" id="freq" value="1.0" step="0.5">
        <button onclick="updateGraph()">Grafiği Güncelle</button>
    </div>

    <!-- Grafiğin çizileceği alan -->
    <div id="plot" style="width:100%;max-width:800px;"></div>

    <script>
        function updateGraph() {
            const freq = document.getElementById('freq').value;
            const formData = new FormData();
            formData.append('frequency', freq);

            // Arka plandaki route'a veriyi gönder ve dönen JSON'ı çizdir
            fetch('/update_plot', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                Plotly.newPlot('plot', data.data, data.layout);
            });
        }
        
        window.onload = updateGraph;
    </script>
</body>
</html>
